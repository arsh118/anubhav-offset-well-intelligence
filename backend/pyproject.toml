[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anubhav-backend"
version = "0.1.0"
description = "ANUBHAV offset well intelligence API"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.110,<1",
  "PyMuPDF>=1.24,<1.26",
  "psycopg[binary]>=3.1,<4",
  "pydantic-settings>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "scikit-learn>=1.4,<2",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.29",
  "mypy>=1.9,<2",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP006", "UP035"]
per-file-ignores = { "app/demo_fixtures.py" = ["E501"] }

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true
follow_imports = "silent"
