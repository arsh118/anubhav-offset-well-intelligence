services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anubhav}
      POSTGRES_USER: ${POSTGRES_USER:-anubhav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - anubhav_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anubhav} -d ${POSTGRES_DB:-anubhav}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anubhav}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-anubhav}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      UPLOAD_DIR: /app/data/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      OFFSET_DEFAULT_RADIUS_KM: ${OFFSET_DEFAULT_RADIUS_KM:-10.0}
      OFFSET_DEFAULT_DEPTH_WINDOW_M: ${OFFSET_DEFAULT_DEPTH_WINDOW_M:-100.0}
      OFFSET_DEPTH_HIGH_MAX_M: ${OFFSET_DEPTH_HIGH_MAX_M:-25.0}
      OFFSET_DEPTH_MEDIUM_MAX_M: ${OFFSET_DEPTH_MEDIUM_MAX_M:-50.0}
      OFFSET_DEPTH_LOW_MAX_M: ${OFFSET_DEPTH_LOW_MAX_M:-100.0}
      OFFSET_FORMATION_WEIGHT: ${OFFSET_FORMATION_WEIGHT:-0.30}
      OFFSET_DEPTH_WEIGHT: ${OFFSET_DEPTH_WEIGHT:-0.25}
      OFFSET_SPATIAL_WEIGHT: ${OFFSET_SPATIAL_WEIGHT:-0.20}
      OFFSET_EVENT_WEIGHT: ${OFFSET_EVENT_WEIGHT:-0.15}
      OFFSET_SOURCE_CONFIDENCE_WEIGHT: ${OFFSET_SOURCE_CONFIDENCE_WEIGHT:-0.10}
      OFFSET_FORMATION_ALIAS_SCORE: ${OFFSET_FORMATION_ALIAS_SCORE:-0.85}
      OFFSET_RELATED_EVENT_SCORE: ${OFFSET_RELATED_EVENT_SCORE:-0.50}
      OFFSET_HIGH_RELEVANCE_MIN_SCORE: ${OFFSET_HIGH_RELEVANCE_MIN_SCORE:-0.75}
      OFFSET_MEDIUM_RELEVANCE_MIN_SCORE: ${OFFSET_MEDIUM_RELEVANCE_MIN_SCORE:-0.50}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - anubhav_uploads:/app/data/uploads

volumes:
  anubhav_postgres:
  anubhav_uploads:
