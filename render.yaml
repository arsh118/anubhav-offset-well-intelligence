services:
  - type: web
    name: anubhav-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://anubhav-nwis.vercel.app
      - key: UPLOAD_DIR
        value: /tmp/anubhav-uploads
